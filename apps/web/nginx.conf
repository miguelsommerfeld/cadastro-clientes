log_format access_json escape=json
    '{"time":"$time_iso8601","level":"info","msg":"http access","reqId":"$request_id","method":"$request_method","route":"$uri","status":$status,"responseTime":$request_time,"remoteAddress":"$remote_addr"}';

server {
    listen 8080;
    server_name localhost;

    access_log /dev/stdout access_json;
    error_log /dev/stderr warn;

    # Serve built static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to your backend container
    location ${API_PROXY_PREFIX}/ {
        proxy_pass http://${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache_bypass $http_upgrade;
    }
}