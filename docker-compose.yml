name: cadastro-clientes
services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
        - "127.0.0.1:5432:5432"
    volumes:
        -  postgres_data:/var/lib/postgresql
    networks:
        - private_net
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 15s

  api:
    build:
        context: ./
        dockerfile: apps/api/Dockerfile
    restart: always
    environment:
        DB_URL: ${DB_URL}
    ports:
        - "127.0.0.1:3333:3333"
    volumes:
        - ./apps/api:/cadastro_clientes/apps/api
        - ./packages:/cadastro_clientes/packages
    depends_on:
        db:
            condition: service_healthy
    networks:
        - public_net
        - private_net
    command: sh -c 'npx prisma db migrate && npx prisma db update && npm run dev' # Aplica as migrações antes de iniciar a aplicação
    healthcheck:
        test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(res => res.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"] # Verifica o status de health da API
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 10s

  web:
    build:
        context: ./
        dockerfile: apps/web/Dockerfile
    restart: always
    ports:
        - "127.0.0.1:8080:8080"
    volumes:
        - ./apps/web:/cadastro_clientes/apps/web
    depends_on:
        api:
            condition: service_healthy
    networks:
        - public_net

networks:
  private_net:
    driver: bridge
  public_net:
    driver: bridge

volumes:
  postgres_data: